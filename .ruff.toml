# Ruff configuration
target-version = "py310"
line-length = 120

[lint]
select = ["E", "F", "I", "UP", "SIM"]
fixable = ["ALL"]
unfixable = []
extend-ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow boolean positional values in function calls
    "FBT003",
]