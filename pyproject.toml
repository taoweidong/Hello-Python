[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Hello-Python"
version = "0.1.0"
description = "数据分析基础项目框架：分层架构、多数据库、CLI 入口，支撑快速二次开发"
requires-python = ">=3.10"
authors = [{name = "Taoweidong", email = "taowd@outlook.com"}]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "loguru>=0.7.3",
    "click>=8.3.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.54",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
]
develop = [
    "pandas-stubs>=2.3.3",
    "ruff>=0.16.8",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pyinstaller>=6.19.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
]

[project.scripts]
hello-python = "src.interfaces.cli.commands:cli"

[tool.setuptools.packages.find]
# 本项目采用"src 作为包"的扁平风格（from src.xxx import ...），显式声明避免误发现
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
fixable = ["ALL"]
unfixable = []
extend-ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow boolean positional values in function calls
    "FBT003",
]

[tool.ruff.lint.per-file-ignores]
# 示例/打包脚本需要在 import 前调整 sys.path
"examples/**" = ["E402"]
"build/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --verbose"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]
