[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Hello-Python"
version = "0.1.0"
description = "A sample Python project"
requires-python = ">=3.10"
authors = [{name = "Taoweidong", email = "taowd@outlook.com"}]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "loguru>=0.7.0",
    "click>=8.1.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pyinstaller>=5.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.0.0"
]
develop = [
    "pandas-stubs>=2.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.0.0"
]

[project.scripts]
Hello-Python = "src.interfaces.cli.commands:cli"
analysis-tool = "src.interfaces.cli.commands:cli"
build-dist = "build.create_dist_zip:create_dist_zip"

[tool.ruff]
target-version = "py310"
select = ["E", "F", "I", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = false
disallow_untyped_defs = false
check_untyped_defs = false
show_error_codes = true
disable_error_code = ["valid-type", "call-overload", "assignment", "attr-defined", "operator", "no-redef"]

[[tool.mypy.overrides]]
module = [
  "src.infrastructure.*",
  "src.core.*",
  "src.config.*",
  "src.db_example",
  "src.click_demo",
  "src.app",
  "src.main",
  "src.services.*",
  "src.interfaces.*"
]
strict = false

[[tool.mypy.overrides]]
module = ["src.infrastructure.database.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]